[project]
name = "yara-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.20.1",
    "anthropic==2.8.0",
    "fastapi==0.162.5",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.8",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
