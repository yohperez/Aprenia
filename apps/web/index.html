<!doctype html>
<html lang="es" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14285a" />
    <meta name="description" content="Yara: aprende gratis, a tu ritmo y sin conexión." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Yara</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem("yara.settings") || "{}");
        var l = s.locale || ((navigator.languages || [navigator.language || ""]).some(function (x) { return x.toLowerCase().indexOf("ar") === 0; }) ? "ar" : "es");
        document.documentElement.lang = l;
        document.documentElement.dir = l === "ar" ? "rtl" : "ltr";
        if (s.vision === "cb") document.documentElement.dataset.vision = "cb";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
